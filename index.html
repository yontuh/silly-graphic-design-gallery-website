<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Lobby</title>
  <script type="module" crossorigin src="/silly-graphic-design-gallery-website/assets/index-Bu-1nvXW.js"></script>
  <link rel="stylesheet" crossorigin href="/silly-graphic-design-gallery-website/assets/index-2Z2SgAYB.css">
</head>
<body>
    <div id="mainframe-ui" class="hidden">
        <div class="terminal-window">
            <div class="terminal-header">
                <span id="ui-header-text" class="blink">_DATA.STREAM.INCOMING</span>
                <button id="close-terminal">[ X ] TERMINATE_LINK</button>
            </div>
            
            <div id="ui-dynamic-content">
            </div>
        </div>

        <button class="toggle-info-btn hidden" id="info-toggle">[ i ] TOGGLE INFO</button>
    </div>

    <div id="lightbox-overlay" class="hidden">
        <button id="close-lightbox">[ X ] CLOSE</button>
        <img id="lightbox-img" src="" alt="Fullscreen view">
    </div>

    <button id="help-btn">[ ? ]</button>

    <div id="help-overlay" class="hidden">
        <div class="help-panel">
            <div class="help-header">
                <button id="close-help">[ x ] close</button>
            </div>
            <div class="help-body">
                <div class="help-section">
                    <h3>flight controls</h3>
                    <ul>
                        <li><kbd>WASD</kbd> or arrow keys — fly</li>
                        <li>scroll — zoom camera</li>
                        <li><kbd>R</kbd> — reset visited portals</li>
                    </ul>
                </div>
                <div class="help-section">
                    <h3>portals</h3>
                    <ul>
                        <li>fly close to an image to enter it</li>
                        <li><kbd>esc</kbd> — close menu</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
